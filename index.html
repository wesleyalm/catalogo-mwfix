
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MWfix | Catálogo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #101010;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            padding: 40px 20px 25px;
            text-align: center;
        }

        .logo {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -3px;
        }

        .logo span {
            color: #ff6600;
        }

        .subtitulo {
            color: #999;
            font-size: 14px;
            margin-top: 8px;
            letter-spacing: 3px;
        }

        .pesquisa {
            display: flex;
            max-width: 650px;
            margin: 30px auto;
            padding: 0 16px;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 17px;
            background: #202020;
            border: 1px solid #383838;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #ff6600;
        }

        button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 16px 22px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #e65c00;
        }

        button:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        #status {
            text-align: center;
            color: #aaa;
            margin: 20px;
            font-size: 14px;
        }

        #resultados {
            display: grid;
            grid-template-columns: repeat(
                auto-fill, minmax(180px, 1fr)
            );
            gap: 15px;
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        .produto {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 12px;
            background: #202020;
            border: 1px solid #292929;
        }

        .produto img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
        }

        .produto:hover img {
            transform: scale(1.04);
        }

        @media (max-width: 600px) {
            #resultados {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 12px;
            }

            .logo {
                font-size: 44px;
            }

            button {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">MW<span>fix</span></div>
        <div class="subtitulo">CATÁLOGO DE PRODUTOS</div>
    </header>

    <form class="pesquisa" id="formPesquisa">

        <input
            type="search"
            id="busca"
            placeholder="O que você procura?"
            autocomplete="off"
            required
        >

        <button id="botao" type="submit">
            Pesquisar
        </button>

    </form>

    <div id="status" aria-live="polite">
        Pesquise para encontrar modelos.
    </div>

    <main id="resultados"></main>

    <script>

        const formulario = document.getElementById("formPesquisa");
        const campoBusca = document.getElementById("busca");
        const resultados = document.getElementById("resultados");
        const status = document.getElementById("status");
        const botao = document.getElementById("botao");

        const API = "https://delicate-queen-fb8c.wesley-almeida12345.workers.dev/";

        formulario.addEventListener("submit", function(evento) {
            evento.preventDefault();
            pesquisar();
        });

        async function pesquisar() {

            const termo = campoBusca.value.trim();

            if (!termo || botao.disabled) return;

            resultados.replaceChildren();
            status.textContent = "Pesquisando modelos...";
            botao.disabled = true;

            const url = new URL(API);

            url.searchParams.set("q", termo);

            try {

                const resposta = await fetch(url);

                if (!resposta.ok) {
                    throw new Error(
                        "Erro HTTP " + resposta.status
                    );
                }

                const dados = await resposta.json();

                const modelos =
                    dados.hits ||
                    dados.data?.hits ||
                    dados.models;

                if (!Array.isArray(modelos)) {
                    throw new Error(
                        "Formato de resposta inesperado."
                    );
                }

                let quantidade = 0;

                function atualizarStatus() {
                    status.textContent = quantidade
                        ? quantidade + " modelos encontrados."
                        : "Nenhum modelo com imagem encontrado.";
                }

                modelos.forEach(modelo => {

                    if (modelo.nsfw) return;

                    const capa =
                        modelo.cover ||
                        modelo.coverUrl;

                    if (typeof capa !== "string") return;

                    let endereco;

                    try {
                        endereco = new URL(capa);
                    } catch {
                        return;
                    }

                    if (endereco.protocol !== "https:") return;

                    const card = document.createElement("div");

                    card.className = "produto";
                    card.dataset.modeloId = modelo.id || "";
                    card.dataset.slug = modelo.slug || "";

                    const imagem = document.createElement("img");

                    imagem.alt = "Foto do modelo";
                    imagem.loading = "lazy";
                    imagem.decoding = "async";

                    imagem.addEventListener("error", () => {

                        card.remove();
                        quantidade--;
                        atualizarStatus();

                    }, { once: true });

                    card.appendChild(imagem);
                    resultados.appendChild(card);

                    quantidade++;

                    imagem.src = endereco.href;

                });

                atualizarStatus();

            } catch (erro) {

                console.error(erro);

                status.textContent =
                    "Não foi possível conectar ao catálogo. " +
                    erro.message;

            } finally {

                botao.disabled = false;

            }

        }

    </script>

</body>
</html>
