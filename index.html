
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MWfix | Catálogo</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #101010;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        header {
            padding: 40px 20px 25px;
            text-align: center;
        }

        .logo {
            font-size: 52px;
            font-weight: 900;
            letter-spacing: -3px;
        }

        .logo span {
            color: #ff6600;
        }

        .subtitulo {
            color: #999;
            font-size: 14px;
            margin-top: 8px;
            letter-spacing: 3px;
        }

        .pesquisa {
            display: flex;
            max-width: 650px;
            margin: 30px auto;
            padding: 0 16px;
            gap: 10px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 17px;
            background: #202020;
            border: 1px solid #383838;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #ff6600;
        }

        button {
            background: #ff6600;
            color: white;
            border: none;
            padding: 16px 22px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #e65c00;
        }

        #status {
            text-align: center;
            color: #aaa;
            margin: 20px;
            font-size: 14px;
        }

        #resultados {
            display: grid;
            grid-template-columns: repeat(
                auto-fill, minmax(180px, 1fr)
            );
            gap: 15px;
            max-width: 1400px;
            margin: auto;
            padding: 20px;
        }

        .produto {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            border-radius: 12px;
            background: #202020;
            border: 1px solid #292929;
        }

        .produto img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s;
        }

        .produto:hover img {
            transform: scale(1.04);
        }

        #carregamento {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 30px;
            color: #aaa;
            font-size: 14px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #333;
            border-top-color: #ff6600;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }

        #fim {
            color: #888;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        #tentarNovamente {
            display: block;
            margin: 15px auto;
        }

        #tentarNovamente[hidden] {
            display: none;
        }

        #sentinela {
            height: 10px;
        }

        @media (max-width: 600px) {

            #resultados {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 12px;
            }

            .logo {
                font-size: 44px;
            }

            button {
                padding: 14px;
            }

        }

    </style>

</head>

<body>

    <header>

        <div class="logo">MW<span>fix</span></div>

        <div class="subtitulo">
            CATÁLOGO DE PRODUTOS
        </div>

    </header>

    <form class="pesquisa" id="formPesquisa">

        <input
            type="search"
            id="busca"
            placeholder="O que você procura?"
            autocomplete="off"
            required
        >

        <button type="submit">
            Pesquisar
        </button>

    </form>

    <div id="status" aria-live="polite">
        Pesquise para encontrar modelos.
    </div>

    <main id="resultados"></main>

    <div id="carregamento">

        <div class="spinner"></div>

        <span>Carregando modelos...</span>

    </div>

    <div id="fim"></div>

    <button id="tentarNovamente" hidden>
        Tentar novamente
    </button>

    <div id="sentinela"></div>

    <script>

        const API =
            "https://delicate-queen-fb8c.wesley-almeida12345.workers.dev/";

        const formulario =
            document.getElementById("formPesquisa");

        const campoBusca =
            document.getElementById("busca");

        const resultados =
            document.getElementById("resultados");

        const status =
            document.getElementById("status");

        const carregamento =
            document.getElementById("carregamento");

        const sentinela =
            document.getElementById("sentinela");

        const fim =
            document.getElementById("fim");

        const tentarNovamente =
            document.getElementById("tentarNovamente");

        let termoAtual = "";

        let offset = 0;

        let total = null;

        let carregando = false;

        let acabou = true;

        let falhou = false;

        let controlador = null;

        let versaoPesquisa = 0;

        const modelosExibidos = new Set();

        function atualizarStatus() {

            const quantidade = resultados.children.length;

            if (total !== null) {

                status.textContent =
                    "Exibindo " +
                    quantidade.toLocaleString("pt-BR") +
                    " de " +
                    total.toLocaleString("pt-BR") +
                    " modelos encontrados.";

            } else {

                status.textContent =
                    quantidade + " modelos exibidos.";

            }

        }

        formulario.addEventListener("submit", evento => {

            evento.preventDefault();

            const termo = campoBusca.value.trim();

            if (!termo) return;

            if (controlador) {
                controlador.abort();
            }

            versaoPesquisa++;

            termoAtual = termo;

            offset = 0;

            total = null;

            carregando = false;

            acabou = false;

            falhou = false;

            modelosExibidos.clear();

            resultados.replaceChildren();

            fim.textContent = "";

            tentarNovamente.hidden = true;

            status.textContent = "Pesquisando modelos...";

            carregarMais();

        });

        async function carregarMais() {

            if (
                carregando ||
                acabou ||
                falhou ||
                !termoAtual
            ) return;

            const versao = versaoPesquisa;

            controlador = new AbortController();

            carregando = true;

            carregamento.style.display = "flex";

            tentarNovamente.hidden = true;

            const url = new URL(API);

            url.searchParams.set("q", termoAtual);

            url.searchParams.set("offset", String(offset));

            try {

                const resposta = await fetch(url, {
                    signal: controlador.signal
                });

                if (!resposta.ok) {

                    throw new Error(
                        "Erro HTTP " + resposta.status
                    );

                }

                const dados = await resposta.json();

                if (versao !== versaoPesquisa) return;

                const modelos =
                    dados.hits ||
                    dados.data?.hits ||
                    dados.models;

                if (!Array.isArray(modelos)) {

                    throw new Error(
                        "Formato de resposta inesperado."
                    );

                }

                const totalRecebido =
                    Number(dados.total ?? dados.data?.total);

                if (
                    Number.isFinite(totalRecebido) &&
                    totalRecebido >= 0
                ) {

                    total = totalRecebido;

                }

                if (modelos.length === 0) {

                    acabou = true;

                    fim.textContent = offset === 0
                        ? "Nenhum modelo encontrado."
                        : "Você chegou ao final dos resultados.";

                    atualizarStatus();

                    return;

                }

                let novosModelos = 0;

                modelos.forEach(modelo => {

                    const chave = String(
                        modelo.id ??
                        modelo.slug ??
                        modelo.cover ??
                        ""
                    );

                    if (!chave) return;

                    if (modelosExibidos.has(chave)) return;

                    modelosExibidos.add(chave);

                    novosModelos++;

                    if (modelo.nsfw) return;

                    const capa =
                        modelo.cover ||
                        modelo.coverUrl;

                    if (typeof capa !== "string") return;

                    let endereco;

                    try {

                        endereco = new URL(capa);

                    } catch {

                        return;

                    }

                    if (endereco.protocol !== "https:") {
                        return;
                    }

                    const card =
                        document.createElement("div");

                    card.className = "produto";

                    card.dataset.modeloId =
                        modelo.id || "";

                    card.dataset.slug =
                        modelo.slug || "";

                    const imagem =
                        document.createElement("img");

                    imagem.alt = "Foto do modelo";

                    imagem.loading = "lazy";

                    imagem.decoding = "async";

                    imagem.addEventListener("error", () => {

                        if (versao !== versaoPesquisa) {
                            return;
                        }

                        card.remove();

                        atualizarStatus();

                    }, { once: true });

                    card.appendChild(imagem);

                    resultados.appendChild(card);

                    imagem.src = endereco.href;

                });

                offset += modelos.length;

                atualizarStatus();

                if (
                    modelos.length < 20 ||
                    (total !== null && offset >= total)
                ) {

                    acabou = true;

                    fim.textContent =
                        "Você chegou ao final dos resultados.";

                } else if (novosModelos === 0) {

                    acabou = true;

                    fim.textContent =
                        "Não há novos resultados disponíveis.";

                }

            } catch (erro) {

                if (versao !== versaoPesquisa) return;

                if (erro.name === "AbortError") return;

                console.error(erro);

                falhou = true;

                fim.textContent =
                    "Não foi possível carregar os modelos. " +
                    erro.message;

                tentarNovamente.hidden = false;

            } finally {

                if (versao === versaoPesquisa) {

                    carregando = false;

                    carregamento.style.display = "none";

                    if (!acabou && !falhou) {

                        requestAnimationFrame(
                            verificarRolagem
                        );

                    }

                }

            }

        }

        function verificarRolagem() {

            const posicao =
                sentinela.getBoundingClientRect().top;

            if (posicao < window.innerHeight + 400) {

                carregarMais();

            }

        }

        const observador = new IntersectionObserver(

            entradas => {

                if (entradas[0].isIntersecting) {

                    carregarMais();

                }

            },

            {
                rootMargin: "400px"
            }

        );

        observador.observe(sentinela);

        tentarNovamente.addEventListener("click", () => {

            falhou = false;

            fim.textContent = "";

            carregarMais();

        });

    </script>

</body>

</html>
